<!DOCTYPE html>
<html>
<head>
    <title>Aplikasi Hemat Data - Sosmed</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getDatabase, ref, set, get, child, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrDQ5buiL2or_YYdzEaRT6Cajxv7x6zhQ",
            authDomain: "aplikasi-hemat-data.firebaseapp.com",
            databaseURL: "https://aplikasi-hemat-data-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "aplikasi-hemat-data",
            storageBucket: "aplikasi-hemat-data.firebasestorage.app",
            messagingSenderId: "57465772327",
            appId: "1:57465772327:web:df1fcdb0b0ad68d2307102"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUserId = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                document.getElementById("auth-section").style.display = "none";
                document.getElementById("app-section").style.display = "block";
                
                const dbRef = ref(db);
                get(child(dbRef, `users/${user.uid}`)).then((snapshot) => {
                    if (snapshot.exists() && snapshot.val().nama) {
                        document.getElementById("setup-nama-section").style.display = "none";
                        document.getElementById("profil-section").style.display = "block";
                        document.getElementById("user-info").innerText = "Halo, " + snapshot.val().nama;
                        muatSemuaPengguna();
                        muatChat();
                    } else {
                        document.getElementById("setup-nama-section").style.display = "block";
                        document.getElementById("profil-section").style.display = "none";
                    }
                }).catch((error) => {
                    alert("Error: " + error.message);
                });
            } else {
                document.getElementById("auth-section").style.display = "block";
                document.getElementById("app-section").style.display = "none";
            }
        });

        window.daftar = async () => {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                alert("Pendaftaran berhasil!");
            } catch (err) { alert(err.message); }
        };

        window.masuk = async () => {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) { alert(err.message); }
        };

        window.keluar = () => signOut(auth);

        window.simpanNama = async () => {
            const namaBaru = document.getElementById("namaBaruInput").value;
            if(!namaBaru) { alert("Nama tidak boleh kosong!"); return; }
            
            try {
                await set(ref(db, 'users/' + currentUserId), {
                    nama: namaBaru,
                    uid: currentUserId
                });
                alert("Nama profil berhasil disimpan!");
                location.reload();
            } catch (err) {
                alert("Gagal menyimpan: " + err.message);
            }
        };

        window.cariTeman = async () => {
            const keyword = document.getElementById("cariInput").value.toLowerCase();
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users`));
            const hasilDiv = document.getElementById("hasilPencarian");
            hasilDiv.innerHTML = "<h4>Hasil Pencarian:</h4>";
            
            let ditemukan = false;
            snapshot.forEach((childSnapshot) => {
                const userData = childSnapshot.val();
                if(userData.nama && userData.nama.toLowerCase().includes(keyword)) {
                    ditemukan = true;
                    hasilDiv.innerHTML += `<p><b>${userData.nama}</b> <button onclick="tambahTeman('${userData.nama}')">➕ Tambah Teman</button> <button onclick="mulaiCall('${userData.nama}')">📞 Video Call</button></p>`;
                }
            });
            if(!ditemukan) { hasilDiv.innerHTML += "<p>Tidak ditemukan.</p>"; }
        };

        async function muatSemuaPengguna() {
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users`));
            const listTeman = document.getElementById("listTeman");
            listTeman.innerHTML = "<h4>Daftar Pengguna Lain:</h4>";
            snapshot.forEach((childSnapshot) => {
                const userData = childSnapshot.val();
                listTeman.innerHTML += `<p>${userData.nama || "Tanpa Nama"} <button onclick="tambahTeman('${userData.nama}')">➕ Tambah Teman</button> <button onclick="mulaiCall('${userData.nama}')">📞 Video Call</button></p>`;
            });
        }

        window.tambahTeman = (namaTeman) => {
            alert("Permintaan pertemanan dikirim ke " + namaTeman);
        };

        window.mulaiCall = (namaTeman) => {
            const roomName = "SosmedCall_" + btoa(namaTeman || "User").substring(0, 10);
            window.open("https://meet.jit.si/" + roomName, "_blank");
        };

        window.kirimPesan = async () => {
            const pesan = document.getElementById("pesanInput").value;
            if(!pesan) return;
            
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users/${currentUserId}`));
            const namaPengirim = snapshot.exists() ? snapshot.val().nama : "User";

            await push(ref(db, 'chats'), {
                pengirim: namaPengirim,
                teks: pesan,
                waktu: Date.now()
            });
            document.getElementById("pesanInput").value = "";
        };

        function muatChat() {
            const chatRef = ref(db, 'chats');
            onChildAdded(chatRef, (data) => {
                let c = data.val();
                let chatBox = document.getElementById("chatBox");
                chatBox.innerHTML += `<b>${c.pengirim}:</b> ${c.teks}<br>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</head>
<body style="font-family: sans-serif; padding: 15px;">

    <!-- Halaman Login -->
    <div id="auth-section">
        <h2>Masuk atau Daftar Aplikasi</h2>
        <input type="email" id="email" placeholder="Email..." style="padding:8px; margin-bottom:5px; width:100%;"><br>
        <input type="password" id="password" placeholder="Password (min. 6 karakter)..." style="padding:8px; margin-bottom:10px; width:100%;"><br>
        <button onclick="masuk()" style="padding:8px 15px;">Login</button>
        <button onclick="daftar()" style="padding:8px 15px;">Daftar Akun Baru</button>
    </div>

    <!-- Halaman Utama Aplikasi -->
    <div id="app-section" style="display:none;">
        <div id="setup-nama-section" style="background: #fffaee; padding: 10px; border: 1px solid #ffd700; margin-bottom: 10px;">
            <h3>Buat Nama Profil Anda Dulu:</h3>
            <input type="text" id="namaBaruInput" placeholder="Ketik nama panggilan/profil..." style="padding: 6px; width: 65%;">
            <button onclick="simpanNama()" style="padding: 6px 12px;">Simpan Nama</button>
        </div>

        <div id="profil-section" style="display:none;">
            <span id="user-info" style="font-weight:bold; font-size: 16px;"></span> 
            <button onclick="keluar()" style="float:right; background:red; color:white; border:none; padding:5px;">Logout</button>
            <hr>

            <h3>Cari Teman</h3>
            <input type="text" id="cariInput" placeholder="Ketik nama teman..." style="width: 65%; padding: 5px;">
            <button onclick="cariTeman()" style="padding: 5px;">Cari</button>
            <div id="hasilPencarian"></div>

            <hr>
            <div id="listTeman"></div>
            
            <hr>
            <h3>Beranda / Ruang Chat Global</h3>
            <div id="chatBox" style="height: 180px; overflow-y: scroll; border: 1px solid #ccc; padding: 5px; margin-bottom: 5px;"></div>
            <input type="text" id="pesanInput" placeholder="Tulis status/pesan..." style="width: 70%; padding: 5px;">
            <button onclick="kirimPesan()" style="padding: 5px;">Kirim</button>
        </div>
    </div>

</body>
</html>
