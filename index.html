<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Dark Lite - Tanpa Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #18191a; color: #e4e6eb; padding: 10px; max-width: 600px; margin: 0 auto; }
        .card { background: #242526; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); margin-bottom: 15px; border: 1px solid #3a3b3c; }
        h2, h3, h4 { color: #2d88ff; margin-bottom: 12px; }
        input, button { width: 100%; padding: 11px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #3a3b3c; outline: none; background: #3a3b3c; color: #e4e6eb; font-size: 14px; }
        input::placeholder { color: #b0b3b8; }
        button { background: #2d88ff; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1a73e8; }
        button.btn-danger { background: #e41e3f; }
        button.btn-success { background: #31a24c; }
        button.btn-secondary { background: #4e4f50; }
        .header-profile { display: flex; align-items: center; justify-content: space-between; }
        .user-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #2d88ff; background: #3a3b3c; }
        .friend-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #3a3b3c; }
        .friend-info { display: flex; align-items: center; gap: 12px; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .online { background-color: #31a24c; }
        .offline { background-color: #b0b3b8; }
        .action-btns { display: flex; gap: 6px; }
        .action-btns button { padding: 6px 10px; font-size: 13px; width: auto; margin-bottom: 0; }
        #chat-box { height: 220px; overflow-y: auto; border: 1px solid #3a3b3c; padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #18191a; }
        .chat-msg { margin-bottom: 8px; font-size: 13px; line-height: 1.4; }
        .chat-msg.me { text-align: right; color: #2d88ff; font-weight: bold; }
    </style>

    <!-- Firebase Firestore SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { 
            getFirestore, collection, setDoc, doc, getDoc, getDocs, 
            query, where, onSnapshot, addDoc, orderBy 
        } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        // Gambar Avatar Default SVG
        const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23b0b3b8'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-.85-5.05-2.2.03-1.67 3.37-2.58 5.05-2.58 1.67 0 5.02.91 5.05 2.58C15.8 19.15 14.03 20 12 20z'/></svg>";

        const firebaseConfig = {
            apiKey: "AIzaSyDrDQ5buiL2or_YYdzEaRT6Cajxv7x6zhQ",
            authDomain: "aplikasi-hemat-data.firebaseapp.com",
            projectId: "aplikasi-hemat-data",
            storageBucket: "aplikasi-hemat-data.firebasestorage.app",
            messagingSenderId: "57465772327",
            appId: "1:57465772327:web:df1fcdb0b0ad68d2307102"
        };

        let app, db;
        let currentUser = null;
        let activeChatFriendUid = null;
        let unsubscribeChat = null;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase Error:", e);
        }

        // Cek Sesi Nama Terdaftar
        window.addEventListener("DOMContentLoaded", () => {
            const savedUid = localStorage.getItem("app_user_uid");
            const savedNama = localStorage.getItem("app_user_nama");

            if (savedUid && savedNama) {
                currentUser = { uid: savedUid, nama: savedNama };
                masukAplikasiUtama();
            } else {
                document.getElementById("auth-section").style.display = "block";
                document.getElementById("app-section").style.display = "none";
            }
        });

        // Buat Akun Hanya Menggunakan Nama
        window.buatAkunNama = async () => {
            const nama = document.getElementById("inputNamaLengkap").value.trim();
            if (!nama) return alert("Masukkan Nama Lengkap Anda!");

            // Buat ID unik berdasarkan nama & waktu
            const uid = "user_" + btoa(nama).replace(/=/g, "") + "_" + Math.floor(Math.random() * 1000);
            
            currentUser = { uid: uid, nama: nama };
            localStorage.setItem("app_user_uid", uid);
            localStorage.setItem("app_user_nama", nama);

            await setDoc(doc(db, "users", uid), {
                nama: nama,
                uid: uid,
                isOnline: true
            }, { merge: true });

            masukAplikasiUtama();
        };

        async function masukAplikasiUtama() {
            document.getElementById("auth-section").style.display = "none";
            document.getElementById("app-section").style.display = "block";

            // Update status online
            await setDoc(doc(db, "users", currentUser.uid), { isOnline: true }, { merge: true });

            window.addEventListener("beforeunload", () => {
                if (currentUser) {
                    setDoc(doc(db, "users", currentUser.uid), { isOnline: false }, { merge: true });
                }
            });

            muatProfilSaya();
            pantauDaftarTeman();
        }

        async function muatProfilSaya() {
            const userDoc = await getDoc(doc(db, "users", currentUser.uid));
            const data = userDoc.exists() ? userDoc.data() : {};
            const namaTampil = data.nama || currentUser.nama;

            document.getElementById("my-name").innerText = namaTampil;
            document.getElementById("inputNamaBaru").value = namaTampil;

            const fotoURL = data.photoURL || DEFAULT_AVATAR;
            document.getElementById("my-avatar").src = fotoURL;
            document.getElementById("previewFoto").src = fotoURL;
        }

        window.gantiAkun = async () => {
            if (currentUser) {
                await setDoc(doc(db, "users", currentUser.uid), { isOnline: false }, { merge: true });
            }
            localStorage.removeItem("app_user_uid");
            localStorage.removeItem("app_user_nama");
            location.reload();
        };

        window.toggleSettings = () => {
            const el = document.getElementById("settings-section");
            el.style.display = (el.style.display === "none" || el.style.display === "") ? "block" : "none";
        };

        window.prosesFoto = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const ctx = canvas.getContext("2d");
                    const maxDim = 250;
                    let width = img.width, height = img.height;

                    if (width > height) {
                        if (width > maxDim) { height *= maxDim / width; width = maxDim; }
                    } else {
                        if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL("image/jpeg", 0.6);
                    document.getElementById("previewFoto").src = compressedBase64;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.simpanProfil = async () => {
            const namaBaru = document.getElementById("inputNamaBaru").value.trim();
            const fotoBase64 = document.getElementById("previewFoto").src;

            if (!namaBaru) return alert("Nama tidak boleh kosong!");

            try {
                currentUser.nama = namaBaru;
                localStorage.setItem("app_user_nama", namaBaru);

                await setDoc(doc(db, "users", currentUser.uid), { 
                    nama: namaBaru, 
                    photoURL: fotoBase64 
                }, { merge: true });

                document.getElementById("my-name").innerText = namaBaru;
                document.getElementById("my-avatar").src = fotoBase64;
                alert("Profil Berhasil Diperbarui!");
                toggleSettings();
            } catch (err) {
                alert("Gagal memperbarui profil: " + err.message);
            }
        };

        window.cariTeman = async () => {
            const keyword = document.getElementById("inputCariNama").value.trim();
            const container = document.getElementById("hasilPencarian");
            container.innerHTML = "";

            if (!keyword) return alert("Masukkan nama yang dicari!");

            try {
                const q = query(collection(db, "users"), where("nama", "==", keyword));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    container.innerHTML = "<p style='color:#e41e3f; font-size:13px;'>Pengguna tidak ditemukan.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const uData = docSnap.data();
                    if (uData.uid !== currentUser.uid) {
                        container.innerHTML += `
                            <div class="friend-item">
                                <b>${uData.nama}</b>
                                <button onclick="tambahTeman('${uData.uid}', '${uData.nama}')" class="btn-success" style="width:auto; padding:5px 10px;">➕ Tambah Teman</button>
                            </div>`;
                    }
                });
            } catch (err) {
                alert("Gagal mencari: " + err.message);
            }
        };

        window.tambahTeman = async (targetUid, targetNama) => {
            try {
                await setDoc(doc(db, "users", currentUser.uid, "teman", targetUid), { uid: targetUid, nama: targetNama });
                await setDoc(doc(db, "users", targetUid, "teman", currentUser.uid), { uid: currentUser.uid, nama: currentUser.nama });
                
                alert(`Berhasil berteman dengan ${targetNama}!`);
                document.getElementById("hasilPencarian").innerHTML = "";
            } catch (err) {
                alert("Gagal menambah teman: " + err.message);
            }
        };

        function pantauDaftarTeman() {
            onSnapshot(collection(db, "users", currentUser.uid, "teman"), (snapshot) => {
                const list = document.getElementById("listTeman");
                list.innerHTML = "";

                if (snapshot.empty) {
                    list.innerHTML = "<p style='font-size:13px; color:#b0b3b8;'>Belum ada teman. Cari nama teman di atas.</p>";
                    return;
                }

                snapshot.forEach((d) => {
                    const t = d.data();
                    onSnapshot(doc(db, "users", t.uid), (userDoc) => {
                        const u = userDoc.exists() ? userDoc.data() : {};
                        const statusClass = u.isOnline ? "online" : "offline";
                        const foto = u.photoURL || DEFAULT_AVATAR;

                        const itemHTML = `
                            <div class="friend-item">
                                <div class="friend-info">
                                    <img src="${foto}" class="user-avatar" style="width:38px; height:38px;">
                                    <div>
                                        <b>${u.nama || t.nama}</b><br>
                                        <small><span class="status-dot ${statusClass}"></span> ${u.isOnline ? "Online" : "Offline"}</small>
                                    </div>
                                </div>
                                <div class="action-btns">
                                    <button onclick="bukaChat('${t.uid}', '${u.nama || t.nama}')" class="btn-secondary">💬 Chat</button>
                                    <button onclick="mulaiPanggilan('${u.nama || t.nama}', 'audio')" class="btn-success">📞</button>
                                    <button onclick="mulaiPanggilan('${u.nama || t.nama}', 'video')">📹</button>
                                </div>
                            </div>
                        `;
                        const elem = document.getElementById("f-" + t.uid);
                        if (elem) elem.outerHTML = itemHTML;
                        else list.innerHTML += `<div id="f-${t.uid}">${itemHTML}</div>`;
                    });
                });
            });
        }

        window.bukaChat = (friendUid, friendNama) => {
            activeChatFriendUid = friendUid;
            document.getElementById("chat-title").innerText = "Chat dengan: " + friendNama;
            document.getElementById("chat-section").style.display = "block";

            const myUid = currentUser.uid;
            const chatId = myUid < friendUid ? `${myUid}_${friendUid}` : `${friendUid}_${myUid}`;

            if (unsubscribeChat) unsubscribeChat();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            unsubscribeChat = onSnapshot(q, (snapshot) => {
                const box = document.getElementById("chat-box");
                box.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isMe = msg.senderUid === myUid;
                    box.innerHTML += `<div class="chat-msg ${isMe ? 'me' : ''}"><b>${isMe ? 'Saya' : friendNama}:</b> ${msg.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        };

        window.kirimPesan = async () => {
            const input = document.getElementById("inputPesan");
            const text = input.value.trim();
            if (!text || !activeChatFriendUid) return;

            const myUid = currentUser.uid;
            const chatId = myUid < activeChatFriendUid ? `${myUid}_${activeChatFriendUid}` : `${activeChatFriendUid}_${myUid}`;

            await addDoc(collection(db, "chats", chatId, "messages"), {
                senderUid: myUid,
                text: text,
                timestamp: new Date()
            });

            input.value = "";
        };

        window.mulaiPanggilan = (namaTeman, tipe) => {
            const myUid = currentUser.uid;
            const roomUnique = "Room_" + btoa(myUid + namaTeman).replace(/=/g, "").substring(0, 12);
            let url = `https://meet.jit.si/${roomUnique}`;
            if (tipe === 'audio') url += "#config.startWithVideoMuted=true";
            window.open(url, "_blank");
        };
    </script>
</head>
<body>

    <!-- Buat Akun Pakai Nama (Tanpa Login Email) -->
    <div id="auth-section" style="display:none;">
        <div class="card">
            <h2>Masuk / Buat Profil</h2>
            <p style="font-size: 13px; color: #b0b3b8; margin-bottom: 12px;">Masukkan Nama Lengkap Anda untuk mulai berkirim pesan dan berteman.</p>
            <input type="text" id="inputNamaLengkap" placeholder="Masukkan Nama Lengkap Anda...">
            <button onclick="buatAkunNama()" class="btn-success">Masuk ke Aplikasi</button>
        </div>
    </div>

    <!-- Halaman Aplikasi Utama -->
    <div id="app-section" style="display:none;">
        
        <!-- Header Profil -->
        <div class="card header-profile">
            <div style="display:flex; align-items:center; gap:12px;">
                <img id="my-avatar" src="" class="user-avatar" alt="Foto Profil">
                <b id="my-name" style="font-size:16px;">Loading...</b>
            </div>
            <div style="display:flex; gap:6px;">
                <button onclick="toggleSettings()" class="btn-secondary" style="width:auto; padding:6px 12px;">⚙️ Edit</button>
                <button onclick="gantiAkun()" class="btn-danger" style="width:auto; padding:6px 12px;">Ganti Nama</button>
            </div>
        </div>

        <!-- Panel Settings -->
        <div id="settings-section" class="card" style="display:none;">
            <h3>Edit Profil</h3>
            <img id="previewFoto" src="" class="user-avatar" style="width:80px; height:80px; display:block; margin: 0 auto 12px;">
            
            <input type="file" id="fileFoto" accept="image/*" onchange="prosesFoto(event)" style="margin-bottom:12px;">
            <input type="text" id="inputNamaBaru" placeholder="Nama Baru...">
            
            <button onclick="simpanProfil()" class="btn-success">Simpan Perubahan</button>
        </div>

        <!-- Cari Teman -->
        <div class="card">
            <h3>Cari & Tambah Teman</h3>
            <div style="display:flex; gap:8px;">
                <input type="text" id="inputCariNama" placeholder="Ketik nama lengkap teman..." style="margin-bottom:0;">
                <button onclick="cariTeman()" style="width:auto; white-space:nowrap;">🔍 Cari</button>
            </div>
            <div id="hasilPencarian" style="margin-top:10px;"></div>
        </div>

        <!-- Daftar Teman -->
        <div class="card">
            <h3>Daftar Teman</h3>
            <div id="listTeman"></div>
        </div>

        <!-- Chat Area -->
        <div id="chat-section" class="card" style="display:none;">
            <h3 id="chat-title">Chat</h3>
            <div id="chat-box"></div>
            <div style="display:flex; gap:8px;">
                <input type="text" id="inputPesan" placeholder="Ketik pesan..." style="margin-bottom:0;">
                <button onclick="kirimPesan()" style="width:auto;">Kirim</button>
            </div>
        </div>

    </div>

</body>
</html>
