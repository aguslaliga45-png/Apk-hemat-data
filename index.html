<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Hemat Data - Super App</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut, 
            updateProfile,
            updateEmail,
            GoogleAuthProvider,
            FacebookAuthProvider,
            signInWithRedirect,
            getRedirectResult,
            RecaptchaVerifier,
            signInWithPhoneNumber
        } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            setDoc, 
            doc, 
            getDoc,
            getDocs, 
            query, 
            where, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDrDQ5buiL2or_YYdzEaRT6Cajxv7x6zhQ",
            authDomain: "aplikasi-hemat-data.firebaseapp.com",
            projectId: "aplikasi-hemat-data",
            storageBucket: "aplikasi-hemat-data.firebasestorage.app",
            messagingSenderId: "57465772327",
            appId: "1:57465772327:web:df1fcdb0b0ad68d2307102"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let confirmationResultPhone = null;

        // Inisialisasi reCAPTCHA & Handle Redirect Result
        window.addEventListener('load', async () => {
            window.recaptchaVerifier = new RecaptchaVerifier('recaptcha-container', {
                'size': 'invisible'
            }, auth);

            try {
                const result = await getRedirectResult(auth);
                if (result) {
                    await simpanUserKeDatabase(result.user);
                }
            } catch (err) {
                console.error("Redirect Error:", err);
            }
        });

        // Simpan data profil ke Firestore
        async function simpanUserKeDatabase(user, customNama = "") {
            const namaTampil = customNama || user.displayName || user.phoneNumber || user.email;
            await setDoc(doc(db, "users", user.uid), {
                nama: namaTampil,
                email: user.email || "",
                phone: user.phoneNumber || "",
                uid: user.uid,
                isOnline: true,
                photoURL: user.photoURL || ""
            }, { merge: true });
        }

        // Status Observer Auth
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById("auth-section").style.display = "none";
                document.getElementById("app-section").style.display = "block";
                
                await simpanUserKeDatabase(user);
                muatProfilSaya(user);
                pantauDaftarTemanSaya();

                // Set status offline saat halaman ditutup
                window.addEventListener("beforeunload", () => {
                    setDoc(doc(db, "users", user.uid), { isOnline: false }, { merge: true });
                });
            } else {
                document.getElementById("auth-section").style.display = "block";
                document.getElementById("app-section").style.display = "none";
            }
        });

        // Load & Tampilkan Profil
        async function muatProfilSaya(user) {
            const userDoc = await getDoc(doc(db, "users", user.uid));
            const data = userDoc.exists() ? userDoc.data() : {};

            const namaTampil = data.nama || user.displayName || user.email;
            document.getElementById("user-info").innerText = "Login sebagai: " + namaTampil;
            document.getElementById("settingNama").value = namaTampil;
            document.getElementById("settingEmail").value = user.email || "";
            document.getElementById("settingPin").value = data.pin || "";

            const fotoURL = data.photoURL || "https://via.placeholder.com/100";
            document.getElementById("imgFotoProfil").src = fotoURL;
            document.getElementById("previewFoto").src = fotoURL;
        }

        // Toggle Tampilan Menu Settings
        window.toggleSettings = () => {
            const el = document.getElementById("settings-section");
            el.style.display = (el.style.display === "none") ? "block" : "none";
        };

        // Konversi Foto ke Base64 (Camera / Album)
        window.prosesFoto = (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById("previewFoto").src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        // Simpan Pengaturan
        window.simpanSettings = async () => {
            const user = auth.currentUser;
            const namaBaru = document.getElementById("settingNama").value.trim();
            const emailBaru = document.getElementById("settingEmail").value.trim();
            const pinBaru = document.getElementById("settingPin").value.trim();
            const fotoBase64 = document.getElementById("previewFoto").src;

            try {
                if (namaBaru) {
                    await updateProfile(user, { displayName: namaBaru });
                }
                if (emailBaru && emailBaru !== user.email) {
                    await updateEmail(user, emailBaru);
                }

                await setDoc(doc(db, "users", user.uid), {
                    nama: namaBaru,
                    email: emailBaru,
                    pin: pinBaru,
                    photoURL: fotoBase64
                }, { merge: true });

                document.getElementById("imgFotoProfil").src = fotoBase64;
                document.getElementById("user-info").innerText = "Login sebagai: " + namaBaru;
                alert("Pengaturan berhasil disimpan!");
                toggleSettings();
            } catch (err) {
                alert("Gagal menyimpan pengaturan: " + err.message);
            }
        };

        // 1. Daftar Akun Email
        window.daftar = async () => {
            const nama = document.getElementById("namaProfil").value.trim();
            const email = document.getElementById("email").value.trim();
            const pass = document.getElementById("password").value;

            if (!nama || !email || !pass) return alert("Isi Nama, Email, dan Password!");
            if (pass.length < 6) return alert("Password minimal 6 karakter!");

            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(res.user, { displayName: nama });
                await simpanUserKeDatabase(res.user, nama);
                alert("Pendaftaran berhasil!");
            } catch (err) {
                alert("Gagal daftar: " + err.message);
            }
        };

        // 2. Login Email
        window.masuk = async () => {
            const email = document.getElementById("email").value.trim();
            const pass = document.getElementById("password").value;
            if (!email || !pass) return alert("Masukkan email dan password!");
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                alert("Gagal login: " + err.message);
            }
        };

        // 3. Google Auth
        window.loginGoogle = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithRedirect(auth, provider);
            } catch (err) {
                alert("Gagal Google Auth: " + err.message);
            }
        };

        // 4. Facebook Auth
        window.loginFacebook = async () => {
            const provider = new FacebookAuthProvider();
            try {
                await signInWithRedirect(auth, provider);
            } catch (err) {
                alert("Gagal Facebook Auth: " + err.message);
            }
        };

        // 5. Kirim OTP SMS
        window.kirimOTP = async () => {
            const phone = document.getElementById("phoneInput").value.trim();
            if (!phone.startsWith("+")) return alert("Sertakan kode negara! Contoh: +628123456789");

            try {
                const appVerifier = window.recaptchaVerifier;
                confirmationResultPhone = await signInWithPhoneNumber(auth, phone, appVerifier);
                document.getElementById("otp-container").style.display = "block";
                alert("Kode OTP dikirim melalui SMS.");
            } catch (err) {
                alert("Gagal kirim OTP: " + err.message);
            }
        };

        // 6. Verifikasi OTP SMS
        window.verifikasiOTP = async () => {
            const code = document.getElementById("otpInput").value.trim();
            if (!code) return alert("Masukkan kode OTP!");
            try {
                const res = await confirmationResultPhone.confirm(code);
                await simpanUserKeDatabase(res.user);
                alert("Login/Daftar No HP Berhasil!");
            } catch (err) {
                alert("Kode OTP salah: " + err.message);
            }
        };

        // Logout
        window.keluar = async () => {
            if (auth.currentUser) {
                await setDoc(doc(db, "users", auth.currentUser.uid), { isOnline: false }, { merge: true });
            }
            signOut(auth);
        };

        // Cari Teman
        window.cariTeman = async () => {
            const keyword = document.getElementById("inputCariNama").value.trim();
            const hasilContainer = document.getElementById("hasilPencarian");
            hasilContainer.innerHTML = "";

            if (!keyword) return alert("Masukkan nama yang dicari!");

            try {
                const q = query(collection(db, "users"), where("nama", "==", keyword));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    hasilContainer.innerHTML = "<p style='color:red;'>Pengguna tidak ditemukan.</p>";
                    return;
                }

                querySnapshot.forEach((docSnapshot) => {
                    const userData = docSnapshot.data();
                    if (userData.uid !== auth.currentUser.uid) {
                        hasilContainer.innerHTML += `
                            <p style="margin:5px 0;">
                                <b>${userData.nama}</b> 
                                <button onclick="tambahTeman('${userData.uid}', '${userData.nama}')" style="padding: 3px 8px; cursor: pointer;">➕ Tambah Teman</button>
                            </p>`;
                    }
                });
            } catch (err) {
                alert("Gagal mencari: " + err.message);
            }
        };

        // Tambah Teman
        window.tambahTeman = async (friendUid, friendNama) => {
            try {
                const myUid = auth.currentUser.uid;
                await setDoc(doc(db, "users", myUid, "teman", friendUid), {
                    uid: friendUid,
                    nama: friendNama,
                    addedAt: new Date()
                });
                alert(`Berhasil menambahkan ${friendNama}!`);
            } catch (err) {
                alert("Gagal menambahkan teman: " + err.message);
            }
        };

        // Pantau Teman Saya (Realtime + Status Online)
        function pantauDaftarTemanSaya() {
            const myUid = auth.currentUser.uid;
            onSnapshot(collection(db, "users", myUid, "teman"), (snapshot) => {
                const listTeman = document.getElementById("listTeman");
                listTeman.innerHTML = "";

                if (snapshot.empty) {
                    listTeman.innerHTML = "<p><i>Belum ada teman.</i></p>";
                    return;
                }

                snapshot.forEach((d) => {
                    const teman = d.data();
                    // Pantau status online masing-masing teman secara realtime
                    onSnapshot(doc(db, "users", teman.uid), (docUser) => {
                        const dataUser = docUser.exists() ? docUser.data() : {};
                        const statusOnline = dataUser.isOnline ? "🟢 <span style='color:green;'>Online</span>" : "🔴 <span style='color:gray;'>Offline</span>";
                        const fotoTeman = dataUser.photoURL || "https://via.placeholder.com/40";

                        const itemID = "teman-" + teman.uid;
                        const existingItem = document.getElementById(itemID);
                        
                        const htmlContent = `
                            <div id="${itemID}" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:5px; border-bottom:1px solid #eee;">
                                <div style="display:flex; align-items:center; gap:10px;">
                                    <img src="${fotoTeman}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
                                    <div>
                                        <b>${dataUser.nama || teman.nama}</b><br>
                                        <small>${statusOnline}</small>
                                    </div>
                                </div>
                                <button onclick="mulaiCall('${dataUser.nama || teman.nama}')" style="padding:5px 10px; cursor:pointer;">📞 Video Call</button>
                            </div>
                        `;

                        if (existingItem) {
                            existingItem.outerHTML = htmlContent;
                        } else {
                            listTeman.innerHTML += htmlContent;
                        }
                    });
                });
            });
        }

        // Video Call
        window.mulaiCall = (namaTeman) => {
            const roomName = "AplikasiHematDataCall_" + btoa((auth.currentUser.displayName || auth.currentUser.uid) + namaTeman).substring(0, 10);
            window.open("https://meet.jit.si/" + roomName, "_blank");
        };
    </script>
</head>
<body style="font-family: sans-serif; padding: 15px; max-width: 500px; margin: 0 auto;">

    <div id="recaptcha-container"></div>

    <!-- Bagian Login / Daftar -->
    <div id="auth-section">
        <h2>Daftar & Masuk Aplikasi</h2>
        
        <input type="text" id="namaProfil" placeholder="Nama Profil..." style="padding:10px; margin-bottom:8px; width:100%; box-sizing: border-box;"><br>
        <input type="email" id="email" placeholder="Email..." style="padding:10px; margin-bottom:8px; width:100%; box-sizing: border-box;"><br>
        <input type="password" id="password" placeholder="Password (min 6 karakter)..." style="padding:10px; margin-bottom:12px; width:100%; box-sizing: border-box;"><br>
        
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button onclick="masuk()" style="flex:1; padding:10px; cursor: pointer;">Login Email</button>
            <button onclick="daftar()" style="flex:1; padding:10px; cursor: pointer;">Daftar Email</button>
        </div>

        <hr style="margin: 15px 0;">

        <button onclick="loginGoogle()" style="padding:10px; width:100%; margin-bottom:8px; background:#4285F4; color:white; border:none; border-radius:4px; cursor:pointer;">
            🌐 Masuk / Daftar dengan Google
        </button>
        <button onclick="loginFacebook()" style="padding:10px; width:100%; margin-bottom:15px; background:#1877F2; color:white; border:none; border-radius:4px; cursor:pointer;">
            📘 Masuk / Daftar dengan Facebook
        </button>

        <hr style="margin: 15px 0;">

        <h3>Daftar / Masuk via Nomor HP</h3>
        <input type="tel" id="phoneInput" placeholder="Contoh: +628123456789" style="padding:10px; width:100%; box-sizing: border-box; margin-bottom:8px;"><br>
        <button onclick="kirimOTP()" style="padding:8px 15px; cursor:pointer;">Kirim OTP SMS</button>

        <div id="otp-container" style="display:none; margin-top:10px;">
            <input type="number" id="otpInput" placeholder="Masukkan 6 Digit OTP..." style="padding:10px; width:100%; box-sizing: border-box; margin-bottom:8px;"><br>
            <button onclick="verifikasiOTP()" style="padding:8px 15px; background:green; color:white; border:none; cursor:pointer;">Verifikasi & Masuk</button>
        </div>
    </div>

    <!-- Bagian Utama Aplikasi -->
    <div id="app-section" style="display:none;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
            <div style="display:flex; align-items:center; gap:10px;">
                <img id="imgFotoProfil" src="https://via.placeholder.com/100" style="width:45px; height:45px; border-radius:50%; object-fit:cover;">
                <span id="user-info" style="font-weight:bold;"></span>
            </div>
            <div>
                <button onclick="toggleSettings()" style="padding:6px 10px; cursor:pointer;">⚙️ Pengaturan</button>
                <button onclick="keluar()" style="background:red; color:white; border:none; padding:6px 12px; cursor: pointer;">Logout</button>
            </div>
        </div>

        <!-- Panel Pengaturan (Settings) -->
        <div id="settings-section" style="display:none; background:#f4f4f4; padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid #ccc;">
            <h3 style="margin-top:0;">⚙️ Pengaturan Profil</h3>
            
            <div style="text-align:center; margin-bottom:10px;">
                <img id="previewFoto" src="https://via.placeholder.com/100" style="width:80px; height:80px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 10px;"><br>
                <label style="background:#007bff; color:white; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px;">
                    📷 Kamera
                    <input type="file" accept="image/*" capture="camera" onchange="prosesFoto(event)" style="display:none;">
                </label>
                <label style="background:#28a745; color:white; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; margin-left:5px;">
                    🖼️ Album
                    <input type="file" accept="image/*" onchange="prosesFoto(event)" style="display:none;">
                </label>
            </div>

            <label style="font-size:12px; font-weight:bold;">Nama Profil:</label>
            <input type="text" id="settingNama" placeholder="Ubah nama..." style="padding:8px; width:100%; box-sizing:border-box; margin-bottom:8px;"><br>

            <label style="font-size:12px; font-weight:bold;">Email:</label>
            <input type="email" id="settingEmail" placeholder="Ubah email..." style="padding:8px; width:100%; box-sizing:border-box; margin-bottom:8px;"><br>

            <label style="font-size:12px; font-weight:bold;">PIN Keamanan:</label>
            <input type="password" id="settingPin" maxlength="6" placeholder="Ubah/Buat PIN 6 Digit..." style="padding:8px; width:100%; box-sizing:border-box; margin-bottom:12px;"><br>

            <button onclick="simpanSettings()" style="padding:8px 15px; background:green; color:white; border:none; cursor:pointer; width:100%;">💾 Simpan Perubahan</button>
        </div>

        <hr style="margin-top: 15px;">
        
        <h3>Cari & Tambah Teman</h3>
