<!DOCTYPE html>
<html>
<head>
    <title>Chat Hemat Data</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDrDQ5buiL2or_YYdzEaRT6Cajxv7x6zhQ",
            authDomain: "aplikasi-hemat-data.firebaseapp.com",
            projectId: "aplikasi-hemat-data",
            storageBucket: "aplikasi-hemat-data.firebasestorage.app",
            messagingSenderId: "57465772327",
            appId: "1:57465772327:web:df1fcdb0b0ad68d2307102"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fungsi kirim pesan
        window.kirimPesan = async () => {
            const pesan = document.getElementById("pesanInput").value;
            if (pesan) {
                await addDoc(collection(db, "chat"), { teks: pesan, waktu: Date.now() });
                document.getElementById("pesanInput").value = "";
            }
        };

        // Tampilkan pesan real-time
        const q = query(collection(db, "chat"), orderBy("waktu", "asc"));
        onSnapshot(q, (snapshot) => {
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML = "";
            snapshot.forEach((doc) => {
                chatBox.innerHTML += `<p>${doc.data().teks}</p>`;
            });
        });
    </script>
</head>
<body>
    <div id="chatBox" style="height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;"></div>
    <input type="text" id="pesanInput" placeholder="Tulis pesan..." style="padding: 5px; width: 70%;">
    <button onclick="kirimPesan()" style="padding: 5px;">Kirim</button>
</body>
</html>
