<!DOCTYPE html>
<html>
<head>
    <title>Aplikasi Sosmed - Cari Teman</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, set, get, child, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrDQ5buiL2or_YYdzEaRT6Cajxv7x6zhQ",
            authDomain: "aplikasi-hemat-data.firebaseapp.com",
            databaseURL: "https://aplikasi-hemat-data-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "aplikasi-hemat-data",
            storageBucket: "aplikasi-hemat-data.firebasestorage.app",
            messagingSenderId: "57465772327",
            appId: "1:57465772327:web:df1fcdb0b0ad68d2307102"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Cek status login lokal di HP pengguna
        window.onload = () => {
            const savedUser = localStorage.getItem("currentNama");
            if (savedUser) {
                document.getElementById("auth-section").style.display = "none";
                document.getElementById("app-section").style.display = "block";
                document.getElementById("user-info").innerText = "Halo, " + savedUser;
                muatSemuaPengguna();
                muatChat();
            } else {
                document.getElementById("auth-section").style.display = "block";
                document.getElementById("app-section").style.display = "none";
            }
        };

        // Daftar hanya menggunakan Nama (Nama kembar ditolak)
        window.daftarAkun = async () => {
            const namaInput = document.getElementById("namaDaftar").value.trim();
            if(!namaInput) {
                alert("Nama akun tidak boleh kosong!");
                return;
            }

            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users`));
            
            let namaSudahAda = false;
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    if (data.nama && data.nama.toLowerCase() === namaInput.toLowerCase()) {
                        namaSudahAda = true;
                    }
                });
            }

            if (namaSudahAda) {
                alert("Nama akun sudah digunakan orang lain! Silakan pakai nama lain.");
                return;
            }

            // Simpan akun baru berdasarkan nama
            const userId = "user_" + Date.now();
            await set(ref(db, 'users/' + userId), {
                nama: namaInput,
                uid: userId
            });

            // Simpan sesi login ke HP
            localStorage.setItem("currentNama", namaInput);
            localStorage.setItem("currentId", userId);
            alert("Pendaftaran berhasil!");
            location.reload();
        };

        // Fitur Logout
        window.keluar = () => {
            localStorage.removeItem("currentNama");
            localStorage.removeItem("currentId");
            location.reload();
        };

        // Cari Teman Berdasarkan Nama Akun
        window.cariTeman = async () => {
            const keyword = document.getElementById("cariInput").value.toLowerCase();
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users`));
            const hasilDiv = document.getElementById("hasilPencarian");
            hasilDiv.innerHTML = "<h4>Hasil Pencarian:</h4>";
            
            const currentUser = localStorage.getItem("currentNama");
            let ditemukan = false;

            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const userData = childSnapshot.val();
                    if(userData.nama && userData.nama.toLowerCase().includes(keyword) && userData.nama !== currentUser) {
                        ditemukan = true;
                        hasilDiv.innerHTML += `<p><b>${userData.nama}</b> <button onclick="tambahTeman('${userData.nama}')">➕ Tambah Teman</button></p>`;
                    }
                });
            }
            if(!ditemukan) { hasilDiv.innerHTML += "<p>Tidak ditemukan.</p>"; }
        };

        async function muatSemuaPengguna() {
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users`));
            const listTeman = document.getElementById("listTeman");
            listTeman.innerHTML = "<h4>Daftar Pengguna Lain:</h4>";
            
            const currentUser = localStorage.getItem("currentNama");
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const userData = childSnapshot.val();
                    if(userData.nama && userData.nama !== currentUser) {
                        listTeman.innerHTML += `<p>${userData.nama} <button onclick="tambahTeman('${userData.nama}')">➕ Tambah Teman</button></p>`;
                    }
                });
            }
        }

        window.tambahTeman = (namaTeman) => {
            alert("Permintaan pertemanan berhasil dikirim ke " + namaTeman);
        };

        // Kirim Pesan Chat Global
        window.kirimPesan = async () => {
            const pesan = document.getElementById("pesanInput").value;
            if(!pesan) return;
            
            const currentUser = localStorage.getItem("currentNama");

            await push(ref(db, 'chats'), {
                pengirim: currentUser,
                teks: pesan,
                waktu: Date.now()
            });
            document.getElementById("pesanInput").value = "";
        };

        function muatChat() {
            const chatRef = ref(db, 'chats');
            onChildAdded(chatRef, (data) => {
                let c = data.val();
                let chatBox = document.getElementById("chatBox");
                chatBox.innerHTML += `<b>${c.pengirim}:</b> ${c.teks}<br>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</head>
<body style="font-family: sans-serif; padding: 15px;">

    <!-- Bagian Pendaftaran / Masuk Pakai Nama -->
    <div id="auth-section">
        <h2>Buat Akun Sosmed (Cukup Pakai Nama)</h2>
        <input type="text" id="namaDaftar" placeholder="Ketik nama akun unik Anda..." style="padding:8px; margin-bottom:10px; width:100%;"><br>
        <button onclick="daftarAkun()" style="padding:10px 20px; background: #0066ff; color: white; border: none; font-weight: bold;">Buat Akun & Masuk</button>
    </div>

    <!-- Bagian Utama Aplikasi -->
    <div id="app-section" style="display:none;">
        <span id="user-info" style="font-weight:bold; font-size: 16px;"></span> 
        <button onclick="keluar()" style="float:right; background:red; color:white; border:none; padding:5px 10px; cursor:pointer;">Logout</button>
        <hr>

        <!-- Fitur Cari Teman Berdasarkan Nama Akun -->
        <h3>Cari Teman</h3>
        <input type="text" id="cariInput" placeholder="Ketik nama akun teman..." style="width: 65%; padding: 5px;">
        <button onclick="cariTeman()" style="padding: 5px;">Cari</button>
        <div id="hasilPencarian"></div>

        <hr>
        <div id="listTeman"></div>
        
        <hr>
        <h3>Ruang Chat Global</h3>
        <div id="chatBox" style="height: 200px; overflow-y: scroll; border: 1px solid #ccc; padding: 8px; margin-bottom: 8px; background: #fafafa;"></div>
        <input type="text" id="pesanInput" placeholder="Tulis pesan..." style="width: 75%; padding: 8px;">
        <button onclick="kirimPesan()" style="padding: 8px 15px;">Kirim</button>
    </div>

</body>
</html>
